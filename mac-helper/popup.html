<!doctype html><html><head><meta charset="utf-8"><title>Rail Helper</title><style>body{font:13px -apple-system,sans-serif;width:280px;padding:14px}h3{margin:0 0 10px}label{display:block;margin:8px 0;font-weight:600}input{width:100%;box-sizing:border-box;padding:7px;margin-top:3px}button{width:49%;padding:9px;border:0;border-radius:7px;font-weight:700}#arm{background:#087f5b;color:white}.stop{background:#c92a2a;color:white}.note{font-size:11px;color:#68717d}</style></head><body><h3>Rail Sheba Seat Helper</h3><label>From<input id="from" value="Dhaka"></label><label>To<input id="to" value="Cox's Bazar"></label><label>Train<input id="train" value="Cox's Bazar Express"></label><label>Journey date<input id="date" type="date" value="2026-09-18"></label><label>Class<input id="seatClass" value="S_CHAIR"></label><label>Adjacent seats<input id="count" type="number" min="1" max="4" value="4"></label><label>Active window<input id="window" value="07:00-09:00"></label><p id="status">Stopped</p><button id="save">Save</button><button id="arm">ARM</button><p class="note">আগে নিজে Cloudflare verify ও Rail Sheba login করুন। Payment/OTP নিজে করবেন।</p><script src="popup.js"></script></body></html>
